slug: das-haus-am-nebelsee
titel: "Das Haus am Nebelsee"
thema: Mystery
wochentag: 2
teile: 6
logline: >
  Detektivin Ella Funke wird in eine Villa am Nebelsee gerufen: Erbin Clara von Lindt ist verschwunden –
  in einem Raum, der von innen verriegelt war. Bis Mitternacht bleibt der Sturm, dann reisen alle Gäste ab.
musik: >
  Mysterious whimsical detective underscore, celesta, plucked harp, low clarinet, soft rain ambience,
  brushed snare, 80 bpm, loopable, instrumental.

figuren:
  ella:
    name: Ella Funke
    ref_tag: ella
    beschreibung: "28, Detektivin, runde Brille, braune Bob-Frisur, knallgelber Regenmantel, Lupe"
    reference_prompt: >
      2D cartoon character model sheet, front and three-quarter view: clever 28-year-old woman, brown bob
      haircut, big round glasses, bright yellow raincoat, red scarf, holding a brass magnifying glass,
      curious smirk, plain light background.
    voice: {voice_id: XB0fDUnXU5powFXDhCwa, model: eleven_v3, stability: 0.5}
  albert:
    name: Albert
    ref_tag: albert
    beschreibung: "70, Butler, weißer Backenbart, Frack, Kerzenleuchter"
    reference_prompt: >
      2D cartoon character model sheet, front and three-quarter view: very tall old butler, white mutton-chop
      sideburns, bushy eyebrows, black tailcoat, white gloves, holding a candelabra, solemn face, plain light background.
    voice: {voice_id: onwK4e9ZLuTAKqWW03F9, model: eleven_v3, stability: 0.5}
  viktor:
    name: Viktor von Lindt
    ref_tag: viktor
    beschreibung: "40, Claras Bruder, gegelte Haare, grüner Samtanzug, nervös"
    reference_prompt: >
      2D cartoon character model sheet, front and three-quarter view: nervous 40-year-old man, slick black
      hair, green velvet suit, monocle, fidgeting hands, plain light background.
    voice: {voice_id: IKne3meq5aSn9XLyUdCD, model: eleven_v3, stability: 0.5}

orte:
  villa:
    ref_tag: villa
    reference_prompt: >
      Gothic lakeside villa at night in thick fog, pointed towers, glowing windows, a jetty on a misty lake,
      bare trees, lightning in the distance.
  salon:
    ref_tag: salon
    reference_prompt: >
      Grand old salon with dark wood panels, fireplace, portraits, grandfather clock, chandelier, Persian rug.
  turmzimmer:
    ref_tag: turmzimmer
    reference_prompt: >
      Round tower room with a locked heavy door, overturned chair, open empty birdcage, window to the foggy lake.

hud:
  stunden:     {label: Zeit,        typ: stunden, start: 6, min: 0}
  hinweise:    {label: Hinweise,    typ: zahl,    start: 0, max: 5}
  verdaechtige: {label: Verdächtige, typ: zahl,   start: 4, min: 0}
anzeige: [stunden, hinweise, verdaechtige]

handlung:
  1: "Ankunft, verriegeltes Turmzimmer, leerer Vogelkäfig – erster Hinweis."
  2: "Verhöre im Salon; Viktor lügt über seine Uhrzeit."
  3: "Geheimgang hinter dem Porträt."
  4: "Der Vogel kehrt zurück – mit einer Nachricht am Bein."
  5: "Falle für den Täter beim Dinner."
  6: "Auflösung um Mitternacht."

teil_01_entwurf:
  beats:
    - "Kutsche im Nebel, Blitz zeigt die Villa (Zeit: noch 6 Stunden)"
    - "Albert öffnet: 'Die gnädige Frau ist fort. Und die Tür war zu.'"
    - "Turmzimmer: Riegel innen, Stuhl umgekippt, Vogelkäfig leer (Hinweise 0 → 1)"
    - "Federn führen zum Fenster – aber es ist zugenagelt (Hinweise 1 → 2)"
    - "Standuhr schlägt, eine Stunde ist weg (Zeit 6 → 5)"
    - "Cliffhanger: Ein Schrei aus dem Keller – und ein Schatten am Fenster"
  entscheidung:
    frage: "Wohin soll Ella zuerst?"
    optionen:
      1: {text: "In den Keller", effekte: {stunden: -1}}
      2: {text: "Dem Schatten zum Steg folgen", effekte: {hinweise: 1, stunden: -1}}
      3: {text: "Alle Gäste im Salon versammeln", effekte: {verdaechtige: -1}}
    standard: 1
