orte:
  villa:
    ref_tag: villa
    reference_prompt: >
      Gothic lakeside villa at night in thick fog, pointed towers, glowing windows, a jetty on a misty lake,
      bare trees, lightning in the distance.
  salon:
    ref_tag: salon
    reference_prompt: >
      Grand old salon with dark wood panels, fireplace, portraits, grandfather clock, chandelier, Persian rug.
  turmzimmer:
    ref_tag: turmzimmer
    reference_prompt: >
      Round tower room with a locked heavy door, overturned chair, open empty birdcage, window to the foggy lake.

hud:
  stunden:     {label: Zeit,        typ: stunden, start: 6, min: 0}
  hinweise:    {label: Hinweise,    typ: zahl,    start: 0, max: 5}
  verdaechtige: {label: Verdächtige, typ: zahl,   start: 4, min: 0}
anzeige: [stunden, hinweise, verdaechtige]

handlung:
  1: "Ankunft, verriegeltes Turmzimmer, leerer Vogelkäfig – erster Hinweis."
  2: "Verhöre im Salon; Viktor lügt über seine Uhrzeit."
  3: "Geheimgang hinter dem Porträt."
  4: "Der Vogel kehrt zurück – mit einer Nachricht am Bein."
  5: "Falle für den Täter beim Dinner."
  6: "Auflösung um Mitternacht."

teil_01_entwurf:
  beats:
    - "Kutsche im Nebel, Blitz zeigt die Villa (Zeit: noch 6 Stunden)"
    - "Albert öffnet: 'Die gnädige Frau ist fort. Und die Tür war zu.'"
    - "Turmzimmer: Riegel innen, Stuhl umgekippt, Vogelkäfig leer (Hinweise 0 → 1)"
    - "Federn führen zum Fenster – aber es ist zugenagelt (Hinweise 1 → 2)"
    - "Standuhr schlägt, eine Stunde ist weg (Zeit 6 → 5)"
    - "Cliffhanger: Ein Schrei aus dem Keller – und ein Schatten am Fenster"
  entscheidung:
    frage: "Wohin soll Ella zuerst?"
    optionen:
      1: {text: "In den Keller", effekte: {stunden: -1}}
      2: {text: "Dem Schatten zum Steg folgen", effekte: {hinweise: 1, stunden: -1}}
      3: {text: "Alle Gäste im Salon versammeln", effekte: {verdaechtige: -1}}
    standard: 1
