      Cold modern bank office, grey desk, glass walls, big wall clock, neat stacks of folders, blue light.

musik: >                       # einmal erzeugen (assets/music/<slug>.mp3), dann in jeder Folge wiederverwenden
  Playful tense heist-comedy underscore, pizzicato strings, ticking clock percussion, upright bass,
  light brass stabs, 100 bpm, loopable, instrumental.

hud:                           # Statusanzeigen – Startwerte vor Teil 1
  geld:     {label: Geld,     typ: geld,  start: 0,     min: 0}
  schulden: {label: Schulden, typ: geld,  start: 18000, min: 0, gut: runter}
  tage:     {label: Frist,    typ: tage,  start: 30,    min: 0}
anzeige: [geld, schulden, tage]

handlung:                      # Bogen über 6 Teile (Details entstehen je nach Zuschauerwahl)
  1: "Erbe, Schuldenbrief, Grells Angebot – erste Entscheidung über das Geld."
  2: "Erste Einnahmen oder Verluste je nach Wahl; Aylin entdeckt Omas geheimes Rezeptbuch."
  3: "Grell sabotiert den Laden (Lieferant springt ab); Stadtfest als Chance."
  4: "Das Rezeptbuch ist mehr wert als gedacht – ein Sammler bietet viel Geld."
  5: "Letzte 5 Tage, alles hängt am Stadtfest-Wettbewerb."
  6: "Finale in der Bank – reicht das Geld?"
