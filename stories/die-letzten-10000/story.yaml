handlung:                      # Bogen über 6 Teile (Details entstehen je nach Zuschauerwahl)
  1: "Erbe, Schuldenbrief, Grells Angebot – erste Entscheidung über das Geld."
  2: "Erste Einnahmen oder Verluste je nach Wahl; Aylin entdeckt Omas geheimes Rezeptbuch."
  3: "Grell sabotiert den Laden (Lieferant springt ab); Stadtfest als Chance."
  4: "Das Rezeptbuch ist mehr wert als gedacht – ein Sammler bietet viel Geld."
  5: "Letzte 5 Tage, alles hängt am Stadtfest-Wettbewerb."
