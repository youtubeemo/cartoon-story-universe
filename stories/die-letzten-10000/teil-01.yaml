geschichte: die-letzten-10000
teil: 1
titel: "Das Erbe mit Haken"
# STORYBOARD v2 – verbindliches Format (siehe docs/STILBIBEL.md):
#   nr, ort, figuren, ansicht (optional, Standard dreiviertel), tageszeit, handlung (deutsch, was passiert und warum),
#   bild (englisch, Startbild/Komposition), kamera, kamerabewegung, bewegung (englisch, konkrete Aktion),
#   uebergang (schnitt | anschluss | ueberblendung | abblende), dauer (4/6/8 s),
#   erzaehler / dialog / sfx / hud optional. Keine @-Tags – Figuren und Ort kommen aus den Feldern.

szenen:
  - nr: 1
    ort: strasse
    figuren: [jonas]
    ansicht: {jonas: seite}
    tageszeit: morgen
    handlung: "Jonas fährt als Kurier durch die Altstadt – pleite, aber gut gelaunt."
    bild: "Jonas on his bicycle in the middle of the cobblestone street, side view, shops behind him"
    kamera: halbtotale
    kamerabewegung: begleitfahrt
    bewegung: "Jonas pedals energetically along the street, his backpack bouncing, he rings his bell and grins"
    uebergang: abblende
    dauer: 6
    erzaehler: "Jonas hat genau null Euro auf dem Konto. Bis heute."
    sfx: [{prompt: "bicycle bell ring and bicycle wheels on cobblestones", dauer: 3, at: 0.5}]

  - nr: 2
    ort: backstube
    figuren: [jonas]
    tageszeit: morgen
    handlung: "In Omas Bäckerei öffnet Jonas den Brief vom Notar und liest von seinem Erbe."
    bild: "Jonas standing behind the glass counter holding a closed envelope with both hands"
    kamera: halbtotale
    kamerabewegung: ranfahrt
    bewegung: "Jonas tears open the envelope, unfolds the letter, reads it and his eyes go wide with surprise"
    uebergang: schnitt
    dauer: 6
    erzaehler: "Oma Edith hat ihm alles vererbt: zehntausend Euro."
    hud: [{key: geld, zu: 10000}]
    sfx: [{prompt: "paper envelope tearing and letter unfolding", dauer: 2, at: 0.5}]

  - nr: 3
    ort: backstube
    figuren: [jonas, aylin]
    tageszeit: morgen
    handlung: "Jonas jubelt, Aylin bleibt skeptisch und zeigt auf das zweite Blatt."
    bild: "Jonas and Aylin standing side by side behind the counter, Jonas holding the letter up"
    kamera: halbnah
    kamerabewegung: statisch
    bewegung: "Jonas jumps and throws both fists in the air cheering, Aylin crosses her arms and points at the letter"
    uebergang: schnitt
    dauer: 6
    dialog:
      - {figur: jonas, text: "Zehntausend! Ich bin reich!"}
      - {figur: aylin, text: "Lies weiter."}

  - nr: 4
    ort: backstube
    figuren: [jonas, aylin]
    tageszeit: morgen
    handlung: "Jonas liest das zweite Blatt – die Bäckerei hat hohe Schulden. Seine Freude kippt."
    bild: "Jonas and Aylin behind the counter, Jonas looking down at the letter"
    kamera: halbnah
    kamerabewegung: statisch
    bewegung: "Jonas flips to the second page, his smile slowly drops, his shoulders sag, Aylin puts a hand on his shoulder"
    uebergang: anschluss
    dauer: 6
    erzaehler: "Und ihre Bäckerei. Mit achtzehntausend Euro Schulden."
    sfx: [{prompt: "comedic sad descending trombone", dauer: 2, at: 3.0}]

  - nr: 5
    ort: bank
    figuren: [jonas]
    tageszeit: tag
    handlung: "Bei der Bank erfährt Jonas die Frist: dreißig Tage bis zur Pfändung."
    bild: "Jonas sitting small on a chair in front of a huge grey desk, a large wall clock behind the desk"
    kamera: totale
    kamerabewegung: statisch
    bewegung: "Jonas nervously fidgets on the chair and sinks lower while the clock hand ticks forward"
    uebergang: ueberblendung
    dauer: 6
    erzaehler: "Die Bank gibt ihm dreißig Tage. Dann wird gepfändet."
    sfx: [{prompt: "loud old wall clock ticking", dauer: 4, at: 0.5}]

  - nr: 6
    ort: strasse
    figuren: [grell]
    ansicht: {grell: vorne}
    tageszeit: tag
    handlung: "Vor der Bäckerei steigt Immobilienhai Grell aus seiner Limousine."
    bild: "Grell standing next to a shiny purple limousine in front of the bakery, adjusting his tie"
    kamera: untersicht
    kamerabewegung: statisch
    bewegung: "Grell closes the car door, straightens his tie and walks towards the bakery with a smug grin"
    uebergang: schnitt
    dauer: 4
    erzaehler: "Dann kommt Herr Grell."
    sfx: [{prompt: "car door closing", dauer: 1, at: 0.4}]

  - nr: 7
    ort: backstube
    figuren: [grell, jonas]
    tageszeit: tag
    handlung: "Grell bietet Jonas einen Spottpreis für den Laden an."
    bild: "Grell leaning over the counter towards Jonas, holding a gold pen and a contract"
    kamera: halbnah
    kamerabewegung: statisch
    bewegung: "Grell slides the contract across the counter and taps it with his gold pen, Jonas leans back"
    uebergang: schnitt
    dauer: 6
    dialog:
      - {figur: grell, text: "Ich kaufe den Laden. Fünftausend Euro. Heute."}

  - nr: 8
    ort: backstube
    figuren: [aylin, grell]
    tageszeit: tag
    handlung: "Aylin stellt sich Grell entgegen."
    bild: "Aylin stepping between the counter and Grell, hands on her hips, Grell in front of her"
    kamera: ueber_schulter
    kamerabewegung: statisch
    bewegung: "Aylin steps forward angrily, a puff of flour rises from her apron, Grell raises an eyebrow"
    uebergang: schnitt
    dauer: 4
    dialog:
      - {figur: aylin, text: "Der Laden ist das Zehnfache wert!"}

  - nr: 9
    ort: backstube
    figuren: [jonas]
    tageszeit: tag
    handlung: "Jonas bezahlt die ersten offenen Rechnungen."
    bild: "Jonas at the counter with a pile of bills and banknotes, a cash register next to him"
    kamera: nah
    kamerabewegung: statisch
    bewegung: "Jonas counts banknotes into an envelope one by one and sighs as the pile gets smaller"
    uebergang: schnitt
    dauer: 6
    erzaehler: "Erste Rechnungen: Mehl und Strom. Fünfzehnhundert Euro."
    hud: [{key: geld, delta: -1500}]
    sfx: [{prompt: "cash register drawer and coins", dauer: 2, at: 1.0}]

  - nr: 10
    ort: strasse
    figuren: []
    tageszeit: abend
    handlung: "Der Tag vergeht."
    bild: "The bakery on the old-town street in warm evening light, street lamps switching on"
    kamera: totale
    kamerabewegung: statisch
    bewegung: "The sun sets quickly, shadows sweep over the cobblestones and the street lamps switch on one by one"
    uebergang: ueberblendung
    dauer: 4
    erzaehler: "Ein Tag ist schon weg."
    hud: [{key: tage, delta: -1}]

  - nr: 11
    ort: backstube
    figuren: [jonas, aylin]
    tageszeit: abend
    handlung: "Der alte Ofen geht mit einem Knall kaputt."
    bild: "Jonas and Aylin standing in front of the big brass oven, evening light"
    kamera: halbtotale
    kamerabewegung: statisch
    bewegung: "The oven shakes, its door bursts open with a puff of black smoke and both jump back startled"
    uebergang: schnitt
    dauer: 6
    erzaehler: "Dann gibt der alte Ofen den Geist auf."
    sfx: [{prompt: "cartoon metal rattling then a loud bang and hiss of steam", dauer: 3, at: 1.0}]

  - nr: 12
    ort: backstube
    figuren: [jonas, aylin]
    tageszeit: abend
    handlung: "Rußverschmiert erkennen beide das Problem."
    bild: "Jonas and Aylin in front of the broken oven, faces covered in soot"
    kamera: halbtotale
    kamerabewegung: statisch
    bewegung: "Aylin coughs and wipes soot off her face, Jonas looks at her and shrugs helplessly"
    uebergang: anschluss
    dauer: 6
    dialog:
      - {figur: aylin, text: "Ohne Ofen kein Brot. Ohne Brot kein Geld."}
      - {figur: jonas, text: "Und ohne Geld kein Ofen."}

  - nr: 13
    ort: strasse
    figuren: [grell]
    tageszeit: nacht
    handlung: "Grell schiebt nachts seine Karte unter der Tür durch."
    bild: "Grell outside the bakery door at night under a street lamp, bending down with a business card"
    kamera: halbnah
    kamerabewegung: statisch
    bewegung: "Grell slides a business card under the door, straightens up, taps the window and walks away"
    uebergang: ueberblendung
    dauer: 4
    dialog:
      - {figur: grell, text: "Mein Angebot gilt bis Mitternacht."}

  - nr: 14
    ort: backstube
    figuren: [jonas]
    tageszeit: nacht
    handlung: "Jonas hält Grells Karte in der Hand und muss sich entscheiden."
    bild: "Jonas alone in the dark bakery holding a business card, the broken oven behind him, moonlight"
    kamera: nah
    kamerabewegung: ranfahrt
    bewegung: "Jonas turns the card in his fingers, looks at the broken oven, then looks up thoughtfully"
    uebergang: schnitt
    dauer: 8
    erzaehler: "Was soll Jonas tun? Eins, zwei oder drei? Schreib es in die Kommentare!"
    entscheidung: true
    sfx: [{prompt: "soft suspense riser ending in a single hit", dauer: 5, at: 3.0}]

entscheidung:
  frage: "Was soll Jonas tun?"
  optionen:
    1: {text: "Neuen Ofen kaufen (4.000 €)", effekte: {geld: -4000}}
    2: {text: "Mit Aylin reparieren (600 €, 2 Tage)", effekte: {geld: -600, tage: -2}}
    3: {text: "Zur Bank: Aufschub (1 Tag)", effekte: {tage: -1}}
  standard: 2
