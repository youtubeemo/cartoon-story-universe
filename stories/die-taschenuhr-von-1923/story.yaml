logline: >
  Uhrmacher-Lehrling Ben repariert eine alte Taschenuhr – und landet im Berlin von 1923, mitten in der
  Hyperinflation. Die Uhr hat nur noch wenig Ladung, und jede Änderung an der Vergangenheit lässt seine
  Gegenwart flackern.
musik: >
  Retro 1920s jazz-inspired time-travel underscore, ticking clock rhythm, muted trumpet, honky-tonk piano,
  shimmering synth swells for time jumps, 110 bpm, loopable, instrumental.

