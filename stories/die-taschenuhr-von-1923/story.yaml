handlung:
  1: "Die Uhr springt nach 1923; Ben trifft Frieda."
  2: "Brot kostet Milliarden – Ben lernt, wie Geld wertlos wird."
  3: "Frieda will die Uhr für eine Zeitungsstory."
  4: "Ben verhindert versehentlich ein Ereignis – seine Werkstatt verschwindet."
  5: "Wettlauf um die Ladung der Uhr."
  6: "Rücksprung – aber wohin?"

