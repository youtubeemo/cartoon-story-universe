# =====================================================================
#  Weg 1 – illustrierter Look (siehe docs/STILBIBEL-ILLU.md)
#  KI-Illustrationen je Shot (nur Standbilder) + eigene Pipeline für Kamera, Anzeigen, Untertitel, Ton.
#  Kostenpflichtig ist nur die Bilderzeugung; sie läuft ausschließlich über csu.produktion.Lauf
#  (Freigabephrase, Kasse, SpendGuard). Hier wird nichts automatisch ausgelöst.
# =====================================================================

aktiv: false                    # bezahlte Bilderzeugung für Weg 1 – nur nach Freigabe im Chat auf true
bildmodell: gen4_image          # 1080p = 8 Credits je Bild (config/pricing.yaml)
format: "1080:1920"
max_referenzen: 3               # Runway gen4_image: höchstens 3 Referenzbilder je Bild

# Einheitlicher Stil – für Referenzblätter UND Shots identisch (flach 2D, ausdrücklich kein 3D).
stil_vorne: >
  Flat 2D cartoon illustration, bold clean outlines, two-tone cel shading, vivid colours, detailed painted
  2D background, warm cinematic light. Not 3D, not CGI, no plastic look.
stil_hinten: >
  Characters exactly as in their reference images. Signs and papers blank, no letters. Food without faces.
  No extra people.

# Referenzblatt: EINE Ansicht von vorn (zwei Ansichten wichen im Test voneinander ab und verwirrten das Modell).
figur_blatt: >
  Character reference: one single full-body figure, front view, standing straight, arms relaxed, neutral
  friendly expression, plain light grey background, nothing else in the image.
ort_blatt: >
  Empty location background, no people, no animals, no text, wide establishing view, rich detail.

# Eigener Stilanker je Geschichte (nur eigene Bilder, keine fremden Werke). Wird bei Referenzblättern als
# Stilvorlage übergeben und belegt in Shots einen freien dritten Referenzplatz.
stil_anker: "assets/illu/{slug}/stil_anker.png"
stil_anker_tag: stilbild
max_prompt_zeichen: 1000        # Runway-Grenze; längere Prompts werden NICHT gekürzt, sondern abgelehnt

# Qualitätskontrolle (illu/qc.py). Bilder ohne Status ok/manuell_ok gelangen nie in eine Folge.
qc:
  ki_pruefung: true             # Claude-Bildprüfung je Bild (≈ 0,02 €), läuft nur im freigegebenen Bilder-Lauf
  pflicht: [alter, gesicht, frisur, haarfarbe, haut, kleidung, proportionen, kein_text, keine_gesichter_auf_essen,
            keine_fremden_figuren, stil_2d]

# Shot-Regeln (Prüfung in illu/storyboard.py)
shot:
  min_s: 1.0
  max_s: 3.6
  woerter_pro_s: 2.7            # deutsches Erzähltempo eleven_v3, gemessen an der Animationsprobe
  vorlauf_s: 0.12
  nachlauf_s: 0.18
folge:
  min_s: 60
  max_s: 90
kamera_arten: [ran, raus, links, rechts, hoch, runter, ruhig]

# Darstellung
schrift:
  untertitel: assets/fonts/Anton-Regular.ttf
  popup: assets/fonts/LuckiestGuy-Regular.ttf
  anzeige: assets/fonts/Baloo2.ttf
untertitel:
  y: 0.66                       # Anteil der Bildhöhe (Mitte der Zeile)
  groesse: 118
  max_zeichen: 14               # 1–2 Wörter je Einblendung
  farbe: "#FFFFFF"
  wort_farbe: "#FF3B30"
  kontur: 9
popup:
  groesse: 120
  farbe: "#FFD400"
  kontur: 10
anzeige:
  y: 0.16
  groesse: 84
  halten_s: 2.2                 # Anzeige bleibt nach einer Änderung so lange sichtbar
partikel: 26
