# =====================================================================
#  CARTOON STORY UNIVERSE – Produktionsplan
#  Mo–So je eine Geschichte. Woche 1 = Teil 1 aller Geschichten, Woche 2 = Teil 2 …
#  Ist eine Geschichte beendet, übernimmt die nächste aus „warteschlange“ ihren Wochentag.
# =====================================================================

start_datum: null            # wird bei der Freigabe gesetzt, z. B. "2026-11-23" (ein Montag)
zeitzone: Europe/Berlin

wochenplan:                  # 0 = Montag … 6 = Sonntag
  0: die-letzten-10000
  1: insel-nr-7
  2: das-haus-am-nebelsee
  3: die-taschenuhr-von-1923
  4: die-karte-der-sieben-gipfel
  5: station-kepler-9
  6: der-drachenimbiss

warteschlange: []            # neue Geschichten nach einem Finale (Slugs aus stories/)

video:
  breite: 1080
  hoehe: 1920
  fps: 30
  ziel_sekunden: [60, 90]
  generierung_ratio:                # je Videomodell; nur veo3.1* liefert echte 1080×1920
    veo3.1_fast: "1080:1920"
    veo3.1: "1080:1920"
    gen4.5: "720:1280"              # Gen-4-Modelle können maximal 720p (werden hochskaliert)
    gen4_turbo: "720:1280"
  crf: 17
  preset: medium                  # höchste Qualität gewünscht → langsameres, besseres Encoding
  audio_bitrate: 192k
  lautheit_lufs: -14.0

# Stil: verbindlich in config/stil.yaml (Stilbibel)

sprecher:                     # durchgehender deutscher Erzähler (ElevenLabs, Premade-Stimme „George“)
  voice_id: JBFqnCBsd6RMkjVDRZzb
  model: eleven_v3
  stability: 0.5


profil: qualitaet                  # test = gen4_image_turbo + gen4_turbo · final = gen4_image + gen4.5

veroeffentlichung:
  tiktok: false               # nur nach gesonderter Freigabe
  youtube: false
