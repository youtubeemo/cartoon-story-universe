# EINMALIGER bezahlter Bildtest Weg 1 – vom Nutzer im Chat am 18.11.2026 12:53 freigegeben:
# höchstens 6 Referenzbilder + 3 Szenenbilder, höchstens 0,86 €. Läuft NUR bei einem Push auf den Test-Branch.
# Freigabe-Schalter werden nur in der Arbeitskopie des Runners gesetzt, nie committet; im Repo bleibt alles gesperrt.
# Bereits erzeugte Bilder liegen danach im Archiv – ein erneuter Lauf kostet 0 €. Branch wird nach dem Test gelöscht.
name: Bildtest Weg 1 (einmalig, freigegeben)

on:
  push:
    branches: [bildtest-weg1-20261118]

permissions:
  contents: write

concurrency:
  group: produktion
  cancel-in-progress: false

jobs:
  bildtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements.txt
          bash scripts/storyhouse_holen.sh
          git config user.name "csu-bot"; git config user.email "csu-bot@users.noreply.github.com"
      - name: Freigabe nur für diesen Lauf (nicht committet)
        run: |
          sed -i 's/^aktiv: false/aktiv: true/' config/illustration.yaml
          sed -i 's/^paid_rendering_enabled: false/paid_rendering_enabled: true/' config/budget.yaml
          git update-index --assume-unchanged config/illustration.yaml config/budget.yaml
      - name: Bilder erzeugen (Rest der Freigabe: 0,86 € − 0,10 € aus Lauf 44299734889)
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}   # nur für den Client-Aufbau, 0 Credits
          CSU_GIT_SYNC: "1"
        run: |
          PHRASE=$(python -c "import yaml;print(yaml.safe_load(open('config/budget.yaml'))['approval_phrase'])")
          python -m illu bilder die-letzten-10000 1 --out ausgabe/bildtest --nur s13,s15,s21 \
            --max-eur 0.765 --bestaetigung "$PHRASE"
      - name: Archiv sichern (nie doppelt bezahlen)
        if: always()
        run: |
          git add state; git add assets/illu 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "Bildtest Weg 1: Bilder und Kasse" && git push -q) || true
      - name: Übersicht und Release (direkte Downloads)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image, ImageDraw
          bilder = sorted(Path("assets/illu/die-letzten-10000").glob("*.png"), key=lambda b: (not b.stem.startswith("ref_"), b.stem))
          kl = [Image.open(b).convert("RGB").resize((360, 640)) for b in bilder]
          bogen = Image.new("RGB", (360 * 4, 640 * ((len(kl) + 3) // 4)), "white")
          for i, (b, im) in enumerate(zip(bilder, kl)):
              ImageDraw.Draw(im).text((10, 10), b.stem[:24], fill="white", stroke_width=2, stroke_fill="black")
              bogen.paste(im, ((i % 4) * 360, (i // 4) * 640))
          bogen.save("ausgabe/bildtest/uebersicht.jpg", quality=90)
          EOF
          TAG="bildtest-weg1-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" ausgabe/bildtest/uebersicht.jpg assets/illu/die-letzten-10000/*.png --prerelease \
            --title "Bildtest Weg 1 (6 Referenzen max., 3 Szenen)" --notes "Einmaliger, freigegebener Test. Kosten siehe Kasse."
          echo "### https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
