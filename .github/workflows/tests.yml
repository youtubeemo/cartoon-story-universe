name: Prüfung (kostenlos)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && bash scripts/storyhouse_holen.sh
      - run: python -m csu validate
      - run: python -m pytest -q tests
