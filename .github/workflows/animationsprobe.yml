# Animationsprobe der 2D-Pipeline. Kostenlos mit Piper; mit ElevenLabs nur im vorhandenen Abo:
# harte Credit-Grenze (Eingabe), kostenlose Vorprüfung von Tarif/Restkontingent/Nachberechnung, Archiv gegen
# Doppelzahlung (assets/stimmen). Nur manuell startbar. Runway wird nicht verwendet.
name: Animationsprobe

on:
  workflow_dispatch:
    inputs:
      storyboard:
        description: "Storyboard-Datei"
        required: false
        default: probe/animationsprobe2.yaml
      stimmen:
        description: "piper (kostenlos) oder elevenlabs (Abo-Credits)"
        required: true
        type: choice
        options: [piper, elevenlabs]
      credit_grenze:
        description: "Höchstens so viele ElevenLabs-Credits"
        required: false
        default: "300"
      max_sekunden:
        description: "Maximale Länge"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: produktion
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -r requirements.txt piper-tts==1.8.0
          bash scripts/storyhouse_holen.sh
      - name: Piper-Stimmen aus dem Cache
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voices-v1
      - name: Rhubarb Lip Sync (nur mit passender Prüfsumme)
        run: |
          URL=$(python -c "import yaml;print(yaml.safe_load(open('config/rhubarb.yaml'))['url'])")
          SHA=$(python -c "import yaml;print(yaml.safe_load(open('config/rhubarb.yaml'))['sha256'])")
          curl -fsSL --retry 3 "$URL" -o /tmp/rhubarb.zip
          echo "$SHA  /tmp/rhubarb.zip" | sha256sum -c -
          unzip -q /tmp/rhubarb.zip -d "$HOME/rhubarb"
          BIN=$(find "$HOME/rhubarb" -type f -name rhubarb | head -n 1); chmod +x "$BIN"
          echo "RHUBARB_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Probe rendern
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SB: ${{ inputs.storyboard }}
          ST: ${{ inputs.stimmen }}
          CG: ${{ inputs.credit_grenze }}
          MS: ${{ inputs.max_sekunden }}
        run: python -m toon probe --storyboard "$SB" --stimmen "$ST" --credit-grenze "$CG" --max-sekunden "$MS" --out ausgabe/probe
      - name: Stimmen-Archiv sichern (nie doppelt bezahlen)
        if: always()
        run: |
          git config user.name "csu-bot"; git config user.email "csu-bot@users.noreply.github.com"
          git add assets/stimmen 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "Stimmen-Archiv (Animationsprobe)" && git push -q) || true
      - name: Als Release (direkter MP4-Download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="animationsprobe-$(date +%Y%m%d-%H%M)"
          python -c "import json;b=json.load(open('ausgabe/probe/bericht.json'));print('\n'.join(f'- {k}: {v}' for k,v in b.items() if k!='endwerte'))" > notiz.txt
          gh release create "$TAG" ausgabe/probe/animationsprobe.mp4 --prerelease --title "Animationsprobe (2D-Rig, ${{ inputs.stimmen }})" --notes-file notiz.txt
          echo "### https://github.com/${{ github.repository }}/releases/download/$TAG/animationsprobe.mp4" >> "$GITHUB_STEP_SUMMARY"
