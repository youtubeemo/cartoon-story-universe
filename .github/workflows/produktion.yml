# =====================================================================
#  Produktion – KOSTENPFLICHTIG (Runway, ElevenLabs, Claude-API), drei Phasen mit Freigaben:
#    vorlagen   → Charaktervorlagen einer Geschichte (Bogen zur Abnahme)
#    storyboard → Startbilder je Szene + KI-Bildprüfung (Bogen zur Abnahme)
#    animation  → nur mit freigegebenem Storyboard: Video, Ton, Schnitt, Qualitätskontrolle, MP4-Release
#    auto       → täglicher Betrieb (animiert Freigegebenes, sonst Storyboard für heute)
#  Läuft nur mit paid_rendering_enabled: true UND (Bestätigungsphrase oder taeglich_aktiv: true).
#  Zentrale Kasse (csu/kasse.py): Monatslimit 150 €, Reservierung vor Beginn, Prüfung vor jedem Aufruf.
# =====================================================================
name: Tagesvideo produzieren

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "vorlagen | storyboard | animation | auto"
        required: true
        type: choice
        options: [storyboard, animation, vorlagen, auto]
      geschichte:
        description: "Geschichte (Slug), leer = Geschichte des Tages"
        required: false
        type: string
      bestaetigung:
        description: "Bestätigungsphrase (config/budget.yaml → approval_phrase)"
        required: false
        type: string
      datum:
        description: "Datum JJJJ-MM-TT (leer = heute)"
        required: false
        type: string
      youtube_video_id:
        description: "YouTube-ID der Vorfolge (Abstimmung, optional)"
        required: false
        type: string
      tiktok_stimmen:
        description: "TikTok-Stimmen der Vorfolge, z. B. 1=34,2=12,3=8 (optional)"
        required: false
        type: string
  # Täglicher Lauf DEAKTIVIERT (18.11.2026, Qualitätsumbau). Erst nach ausdrücklicher Freigabe einkommentieren:
  # schedule:                   # 05:17 Uhr deutscher Zeit: Winter = 04:17 UTC, Sommer = 03:17 UTC
  #   - cron: "17 3 * * *"
  #   - cron: "17 4 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: produktion
  cancel-in-progress: false

jobs:
  produktion:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Werkzeuge (kostenlos)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -r requirements.txt
          bash scripts/storyhouse_holen.sh
      - name: Cache bezahlter Ergebnisse (verhindert doppelte Kosten)
        uses: actions/cache@v4
        with:
          path: .cache/auftraege
          key: auftraege-${{ github.run_id }}
          restore-keys: auftraege-

      - name: Produzieren
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          PHASE: ${{ inputs.phase || 'auto' }}
          GESCHICHTE: ${{ inputs.geschichte }}
          BESTAETIGUNG: ${{ inputs.bestaetigung }}
          DATUM: ${{ inputs.datum }}
          YT_ID: ${{ inputs.youtube_video_id }}
          TT: ${{ inputs.tiktok_stimmen }}
          GEPLANT: ${{ github.event_name == 'schedule' && '--geplant' || '' }}
          CSU_GIT_SYNC: "1"
        run: |
          git config user.name "csu-bot"; git config user.email "csu-bot@users.noreply.github.com"
          TZ=Europe/Berlin python -m csu produzieren --phase "$PHASE" --out ausgabe $GEPLANT \
            ${GESCHICHTE:+--geschichte "$GESCHICHTE"} --bestaetigung "$BESTAETIGUNG" \
            --datum "${DATUM:-$(TZ=Europe/Berlin date +%F)}" --youtube-video-id "$YT_ID" --tiktok-stimmen "$TT"

      - name: Stand, Kosten, Vorlagen und Storyboards sichern
        if: always()
        run: |
          git config user.name "csu-bot"; git config user.email "csu-bot@users.noreply.github.com"
          git add state assets stories berichte 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "Produktion $(date +%F): Stand, Kosten, Ergebnisse"
          git push -q || echo "Push fehlgeschlagen – Stand liegt im Log"

      - name: Ergebnis als Release (direkter Download, kein ZIP)
        id: release
        if: success() && hashFiles('ausgabe/release.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=ausgabe/release.json
          TAG=$(jq -r .tag $R); TITEL=$(jq -r .titel $R); cp "$(jq -r .bericht $R)" notiz.txt
          FLAGS=""; [ "$(jq -r .prerelease $R)" = true ] && FLAGS="--prerelease"; [ "$(jq -r .draft $R)" = true ] && FLAGS="--draft"
          mapfile -t DATEIEN < <(jq -r '.dateien[]' $R)
          gh release create "$TAG" "${DATEIEN[@]}" --title "$TITEL" --notes-file notiz.txt $FLAGS
          echo "titel=$TITEL" >> "$GITHUB_OUTPUT"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Benachrichtigung (GitHub-App aufs iPhone)
        if: success() && steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITEL: ${{ steps.release.outputs.titel }}
        run: gh issue create --title "🎬 $TITEL" --body "$(cat notiz.txt)" || true
