# =====================================================================
#  Tagesvideo produzieren – KOSTENPFLICHTIG (Runway, ElevenLabs, optional Claude-API)
#
#  Der Zeitplan ist aktiv. Geld wird nur ausgegeben, wenn config/budget.yaml paid_rendering_enabled: true ist UND
#    * täglich: taeglich_aktiv: true, oder
#    * manuell: die Bestätigungsphrase eingegeben wird.
#  Sonst endet der Lauf nach kostenlosen Prüfungen erfolgreich („keine Produktion, 0 €“).
#  Zentrale Kasse (csu/kasse.py): Monatslimit, Reservierung vor Beginn, Prüfung vor jedem Aufruf, Protokoll.
#  Ergebnis: MP4 als GitHub-Release-Datei (direkter Link, kein ZIP), Produktionsbericht, Issue mit Link.
# =====================================================================
name: Tagesvideo produzieren

on:
  workflow_dispatch:
    inputs:
      bestaetigung:
        description: "Bestätigungsphrase (config/budget.yaml → approval_phrase)"
        required: false
        type: string
      datum:
        description: "Datum JJJJ-MM-TT (leer = heute)"
        required: false
        type: string
      youtube_video_id:
        description: "YouTube-ID der Vorfolge (für die Abstimmung, optional)"
        required: false
        type: string
      tiktok_stimmen:
        description: "TikTok-Stimmen der Vorfolge, z. B. 1=34,2=12,3=8 (optional)"
        required: false
        type: string
  schedule:                     # 05:17 Uhr deutscher Zeit: Winter = 04:17 UTC, Sommer = 03:17 UTC
    - cron: "17 3 * * *"        # der jeweils unpassende Termin beendet sich sofort ohne Kosten
    - cron: "17 4 * * *"

permissions:
  contents: write     # Stand + Referenzbilder sichern, Release anlegen
  issues: write       # Benachrichtigung mit Download-Link

concurrency:
  group: produktion
  cancel-in-progress: false

jobs:
  video:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Werkzeuge (kostenlos)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -r requirements.txt
          bash scripts/storyhouse_holen.sh
      - name: Cache bezahlter Ergebnisse (verhindert doppelte Kosten)
        uses: actions/cache@v4
        with:
          path: .cache/auftraege
          key: auftraege-${{ github.run_id }}
          restore-keys: auftraege-

      - name: Produzieren
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          BESTAETIGUNG: ${{ inputs.bestaetigung }}
          DATUM: ${{ inputs.datum }}
          YT_ID: ${{ inputs.youtube_video_id }}
          TT: ${{ inputs.tiktok_stimmen }}
          GEPLANT: ${{ github.event_name == 'schedule' && '--geplant' || '' }}
          CSU_GIT_SYNC: "1"
        run: |
          TZ=Europe/Berlin python -m csu produzieren --out ausgabe $GEPLANT \
            --bestaetigung "$BESTAETIGUNG" --datum "${DATUM:-$(TZ=Europe/Berlin date +%F)}" \
            --youtube-video-id "$YT_ID" --tiktok-stimmen "$TT"

      - name: Stand, Kosten und Referenzbilder sichern
        if: always()
        run: |
          git config user.name "csu-bot"
          git config user.email "csu-bot@users.noreply.github.com"
          git add state assets stories berichte 2>/dev/null || git add state assets stories
          git diff --cached --quiet || git commit -q -m "Produktion $(date +%F): Stand und Kosten"
          git push -q || echo "Push fehlgeschlagen – Stand liegt im Log"

      - name: MP4 als Release veröffentlichen (direkter Download)
        id: release
        if: success() && hashFiles('ausgabe/release.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r .tag ausgabe/release.json); DATEI=$(jq -r .datei ausgabe/release.json)
          NAME=$(jq -r .dateiname ausgabe/release.json); TITEL=$(jq -r .titel ausgabe/release.json)
          cp "$(jq -r .bericht ausgabe/release.json)" notiz.txt
          gh release create "$TAG" "$DATEI" --title "$TITEL" --notes-file notiz.txt
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$NAME"
          echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "titel=$TITEL" >> "$GITHUB_OUTPUT"

      - name: Optional – zusätzlicher Link ohne GitHub-Login (Cloudflare R2, 7 Tage gültig)
        id: r2
        if: success() && env.R2_BUCKET != '' && steps.release.outputs.url != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          DATEI=$(jq -r .datei ausgabe/release.json); NAME=$(jq -r .dateiname ausgabe/release.json)
          aws s3 cp "$DATEI" "s3://$R2_BUCKET/$NAME" --endpoint-url "$R2_ENDPOINT" --content-type video/mp4 --only-show-errors
          echo "url=$(aws s3 presign "s3://$R2_BUCKET/$NAME" --endpoint-url "$R2_ENDPOINT" --expires-in 604800)" >> "$GITHUB_OUTPUT"

      - name: Benachrichtigung (GitHub-App aufs iPhone)
        if: success() && steps.release.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.release.outputs.url }}
          R2: ${{ steps.r2.outputs.url }}
          TITEL: ${{ steps.release.outputs.titel }}
        run: |
          BODY="$(cat notiz.txt)"
          [ -n "$R2" ] && BODY="**Ohne Login (7 Tage):** $R2"$'\n\n'"$BODY"
          gh issue create --title "🎬 $TITEL" --body "$BODY" || true
